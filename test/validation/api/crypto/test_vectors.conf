# Crypto test vector example file
#
# A test vector file consists of named sets of test vectors. Test
# vectors are named blocks within the test vector sets. All test
# vectors of a set use the cipher and auth algorithm specified for
# the set. Parameters may be omitted, in which case defaults apply
# (0 for decimal numbers, zero length array for byte arrays).
#
# Scalar values are decimal. Byte arrays are strings of hexadecimal
# numbers without 0x prefixes and with optional spaces between bytes.
# Lengths of byte arrays are deduced from the strings, but can be
# overridden with explicit length parameters. A long string can
# be split to adjacent quoted pieces as libconfig concatenates them.

# Version of test vector file format
version = 1

# Named test vector set. The name cannot start with a number.
aes_cbc:
{
	# Cipher used by all vectors in this set. The value string is the
	# unique suffix of the ODP cipher algorithm name in lower case.
	# In this case "aes_cbc" maps to ODP_CIPHER_ALG_AES_CBC.
	# If omitted, ODP_CIPHER_ALG_NULL is used.
	cipher = "aes_cbc"

	# Auth algorithm used by all vectors in this set.
	# ODP_AUTH_ALG_NULL if omitted
	# auth = "null"

	# Named test vector and all supported parameters
	# example: {
	#	# Byte arrays
	#	cipher_key = <hex string>
	#	cipher_iv  = <hex string>
	#	auth_key   = <hex string>
	#	auth_iv    = <hex string>
	#	aad        = <hex string>
	#	plaintext  = <hex string>
	#	ciphertext = <hex string> (if omitted, same as plaintext)
	#	digest     = <hex string>
	#
	#	# Lengths in bytes. Must not exceed the corresponding array
	#	# length but may be shorter. If omitted, length is the length
	#	# of the byte array.
	#	cipher_key_length = <decimal_number>
	#	cipher_iv_length  = <decimal_number>
	#	auth_key_length   = <decimal_number>
	#	auth_iv_length    = <decimal_number>
	#	aad_length        = <decimal_number>
	#	digest_length     = <decimal_number>
	#
	#	# Length of plaintext and ciphertext in bytes
	#	length      = <decimal_number>
	#
	#	# Length of plaintext and ciphertext in bits
	#	length_bits = <decimal_number>
	# }

	vector_a:
	{
		cipher_key = "06a9214036b8a15b512e03d534120006"
		cipher_iv = "3dafba429d9eb430b422da802c9fac41"
		plaintext = "53 69 6e 67 6c 65 20 62"
			    "6c 6f 63 6b 20 6d 73 67"
		ciphertext = "e3 53 77 9c 10 79 ae b8"
			     "27 08 94 2d be 77 18 1a"
	}
}
