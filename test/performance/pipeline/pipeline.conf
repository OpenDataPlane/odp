# Example for an external work library, see the "External work libraries" section of README.md

queues: (
	{
		name: "queue1";
		type: "plain";
	},
	{
		name: "queue2";
		type: "plain";
	}
);

flows: (
	{
		name: "flow1";
		input: "queue1";
		work: (
			{
				type: "example";
				param: ( "queue2" );
			}
		);
	}
);

workers: (
	{
		name: "worker1";
		type: "plain";
		inputs: [ "queue1" ];
	}
);

cpumap: {
	cpumask: "0x2";
	workers: [ "worker1" ];
};
